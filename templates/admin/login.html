<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso editorial | Web Noticias</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-body"><form class="login-card" method="post"><a class="brand" href="{{ url_for('index') }}">Web <em>Noticias</em></a><p class="eyebrow">ACCESO EDITORIAL</p><h1>Ingresar al panel</h1><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label>{% with messages=get_flashed_messages(with_categories=true) %}{% for kind,msg in messages %}<p class="form-error">{{ msg }}</p>{% endfor %}{% endwith %}<button class="button-dark" type="submit">Ingresar</button><a class="back-link" href="{{ url_for('index') }}">← Volver al sitio</a></form></body></html>
