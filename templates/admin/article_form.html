{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="admin-heading"><div><span class="eyebrow">REDACCIÓN</span><h1>{{ 'Editar noticia' if item else 'Nueva noticia' }}</h1></div></div><form class="admin-box editor-form" method="post" enctype="multipart/form-data"><label>Título<input name="title" required value="{{ item.title if item else '' }}"></label><label>Copete / resumen<textarea name="summary" rows="3">{{ item.summary if item else '' }}</textarea></label><label>Contenido<textarea name="body" rows="14" required>{{ item.body if item else '' }}</textarea></label><div class="form-grid"><label>Sección<select name="category">{% for cat in categories %}<option {% if item and item.category==cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label><label>Autor<input name="author" value="{{ item.author if item else 'Redacción' }}"></label></div><label>Enlace de la fuente<input type="url" name="source_url" value="{{ item.source_url if item else '' }}" placeholder="https://..."></label><label>Fotografía<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif"></label>{% if item and item.image %}<p class="muted">Imagen actual: {{ item.image }}</p>{% endif %}<div class="check-row"><label><input type="checkbox" name="is_featured" {% if item and item.is_featured %}checked{% endif %}> Destacar en portada</label><label><input type="checkbox" name="is_breaking" {% if item and item.is_breaking %}checked{% endif %}> Último momento</label><label><input type="checkbox" name="published" {% if not item or item.published %}checked{% endif %}> Publicar</label></div><div class="form-actions"><button class="button-dark">Guardar noticia</button><a class="back-link" href="{{ url_for('admin_articles') }}">Cancelar</a></div></form>{% endblock %}
